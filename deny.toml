# Default cargo-deny policy for UniverLab crates (used by scripts/rust-quality.sh
# when a crate ships no deny.toml of its own). A crate that needs an exception
# copies this file to its root and edits it there — the exception then lives
# next to the code that needs it, reviewed in that repo's PRs.

[graph]
all-features = true

[advisories]
# Vulnerabilities fail. Unmaintained/unsound notices fail too, for crates
# anywhere in the tree: a dead dependency is a decision to take, not to ignore.
version = 2
yanked = "deny"
unmaintained = "all"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste (proc-macro) via lancedb/lance/datafusion, no maintained release upstream; revisit when datafusion moves off it" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser via pdf-extract/lopdf, no maintained release upstream; revisit when lopdf moves off it" },
  { id = "RUSTSEC-2026-0391", reason = "zstd 0.13.3 via arrow-ipc 57 <- lance/lancedb; fixed in zstd >=0.14.3, which needs arrow-ipc >=60 and a lance/lancedb/datafusion major upgrade; revisit with that upgrade" },
  { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7.x via zstd 0.13 <- arrow-ipc 57; fixed in >=8.2.0, same upgrade path as RUSTSEC-2026-0391; revisit with that upgrade" },
  { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7.x via zstd 0.13 <- arrow-ipc 57; fixed in >=8.2.0, same upgrade path as RUSTSEC-2026-0391; revisit with that upgrade" },
]

[licenses]
version = 2
# Permissive licenses compatible with shipping MIT/Apache binaries.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The allow-list is lab-wide; a crate that uses only some of it is fine.
unused-allowed-license = "allow"

[bans]
# Duplicate versions are reported, not failed: most come from upstream and a
# gate a crate cannot fix on its own teaches people to ignore gates.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

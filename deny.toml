# Default cargo-deny policy for UniverLab crates (used by scripts/rust-quality.sh
# when a crate ships no deny.toml of its own). A crate that needs an exception
# copies this file to its root and edits it there — the exception then lives
# next to the code that needs it, reviewed in that repo's PRs.

[graph]
all-features = true

[advisories]
# Vulnerabilities fail. Unmaintained/unsound notices fail too, for crates
# anywhere in the tree: a dead dependency is a decision to take, not to ignore.
version = 2
yanked = "deny"
unmaintained = "all"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste (proc-macro) via lancedb/lance/datafusion, no maintained release upstream; revisit when datafusion moves off it" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser via pdf-extract/lopdf, no maintained release upstream; revisit when lopdf moves off it" },
  { id = "RUSTSEC-2026-0391", reason = "zstd 0.13.3 via arrow-ipc 57 <- lance/lancedb; fixed in zstd >=0.14.3, which needs arrow-ipc >=60 and a lance/lancedb/datafusion major upgrade; revisit with that upgrade" },
  { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7.x via zstd 0.13 <- arrow-ipc 57; fixed in >=8.2.0, same upgrade path as RUSTSEC-2026-0391; revisit with that upgrade" },
  { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7.x via zstd 0.13 <- arrow-ipc 57; fixed in >=8.2.0, same upgrade path as RUSTSEC-2026-0391; revisit with that upgrade" },
  { id = "RUSTSEC-2026-0457", reason = "rmcp 2.1.0 OAuth-client SSRF (fixed in 3.7.0). Affects the rmcp OAuth client only; canopy enables the rmcp server features alone (server, transport-io, transport-streamable-http-server), so no client transport is compiled, and the daemon serves MCP on 127.0.0.1 to a local bridge only, so no attacker-controlled authorization-server metadata reaches this path; revisit: remove when FIX-95 upgrades rmcp" },
  { id = "RUSTSEC-2026-0462", reason = "rmcp 2.1.0 unbounded response-body buffering in Streamable HTTP clients (fixed in 3.9.0). Affects rmcp's streamable-http/Unix-socket clients, which canopy does not compile or use: it is the MCP server side, reachable only over loopback by the local bridge, so a hostile MCP server is not in the trust path; revisit: remove when FIX-95 upgrades rmcp" },
  { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.37.0 bundles SQLite <3.54.0 (fixed in 0.39.0, needs rusqlite 0.41). Path: rusqlite 0.39 <- lancedb/lance. The flaw needs the process to open a database together with a crafted sibling -wal from a less trusted party; canopy opens only the database it created under ~/.canopy and never a caller-supplied one, and no MCP tool takes a database path, so the local crafted-file precondition is absent; revisit: remove when FIX-95 upgrades libsqlite3-sys" },
]

[licenses]
version = 2
# Permissive licenses compatible with shipping MIT/Apache binaries.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The allow-list is lab-wide; a crate that uses only some of it is fine.
unused-allowed-license = "allow"

[bans]
# Duplicate versions are reported, not failed: most come from upstream and a
# gate a crate cannot fix on its own teaches people to ignore gates.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

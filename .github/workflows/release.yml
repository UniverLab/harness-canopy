name: Release

# Trunk-based release (decision 10eadef1), run by hand on main: CI on main,
# then UniverLab/workflows rust-release-manual.yml checks the version bump,
# builds the binaries, publishes to crates.io through Trusted Publishing in
# the `production` environment (admin approval, main only) and creates the
# tag and GitHub release last. crates.io trusts this file name (release.yml)
# and that environment.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: ci
    uses: UniverLab/workflows/.github/workflows/rust-release-manual.yml@main
    with:
      binary-name: canopy
      system-packages: protobuf-compiler
      system-packages-brew: protobuf
      # The published Linux binary is glibc, not static musl: it loads the
      # ONNX Runtime that local RAG embeddings need.
      linux-target: x86_64-unknown-linux-gnu
      features: local-embeddings
      include-windows: false
